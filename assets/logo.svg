<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#00464D"/>

  <!-- ── PERFUME BOTTLE ICON ── -->
  <!-- Spray nozzle / cap top -->
  <rect x="188" y="52" width="24" height="10" rx="3" fill="white"/>
  <!-- Neck -->
  <rect x="176" y="62" width="48" height="22" rx="3" fill="none" stroke="white" stroke-width="5"/>

  <!-- Bottle outer rectangle (rounded) -->
  <rect x="120" y="84" width="160" height="130" rx="12" fill="none" stroke="white" stroke-width="6"/>

  <!-- X cross lines inside bottle — clipped to bottle shape -->
  <clipPath id="bottleClip">
    <rect x="120" y="84" width="160" height="130" rx="12"/>
  </clipPath>
  <g clip-path="url(#bottleClip)">
    <line x1="120" y1="84"  x2="280" y2="214" stroke="white" stroke-width="6"/>
    <line x1="280" y1="84"  x2="120" y2="214" stroke="white" stroke-width="6"/>
  </g>

  <!-- Bottom arc / C curve -->
  <path d="M 148 210 Q 200 236 252 210" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- ── AMORE TEXT ── -->
  <text
    x="200"
    y="296"
    font-family="'Playfair Display', Georgia, serif"
    font-size="62"
    font-weight="700"
    letter-spacing="12"
    fill="white"
    text-anchor="middle"
  >AMORE</text>

  <!-- ── TAGLINE ── -->
  <text
    x="200"
    y="332"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="14"
    font-weight="300"
    letter-spacing="8"
    fill="white"
    opacity="0.85"
    text-anchor="middle"
  >EXCLUSIVE PERFUME</text>
</svg>
