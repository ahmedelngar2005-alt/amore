<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMORE — Exclusive Perfume | عطور حصرية فاخرة</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              DEFAULT: '#00464D',
              dark: '#002B30',
              deep: '#002024',
              surface: '#00383D',
              accent: '#005F68'
            },
            gold: {
              DEFAULT: '#D4AF37',
              light: '#E5C158',
              hover: '#C29F2E',
              subtle: 'rgba(212, 175, 55, 0.15)'
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'Amiri', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'Cairo', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #002024; }
    ::-webkit-scrollbar-thumb { background: #00464D; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    html { scroll-behavior: smooth; }
    .glass-effect {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.5s ease forwards; }
  </style>
</head>
<body class="min-h-screen bg-[#FAF8F5] text-[#002B30] dark:bg-[#002B30] dark:text-[#F3F4F6] transition-colors duration-300 font-sans flex flex-col justify-between selection:bg-[#D4AF37] selection:text-[#002B30]">

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-[#00464D] text-[#D4AF37] border border-[#D4AF37]/40 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 pointer-events-none">
    <i data-lucide="sparkles" class="w-5 h-5 text-[#D4AF37]"></i>
    <span id="toast-message" class="text-xs font-bold"></span>
  </div>

  <!-- Announcement Header -->
  <div class="bg-[#002024] text-[#E5C158] text-xs py-2 px-4 text-center font-semibold tracking-wide border-b border-[#D4AF37]/20 flex items-center justify-center gap-2">
    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
    <span id="announcement-text"></span>
  </div>

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 glass-effect bg-[#002B30]/90 dark:bg-[#002024]/90 border-b border-[#D4AF37]/20 text-[#FAF8F5]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center space-x-6 rtl:space-x-reverse text-sm font-semibold tracking-wide">
        <button onclick="switchView('home')" id="nav-home" class="hover:text-[#D4AF37] transition-colors py-1"></button>
        <button onclick="switchView('shop')" id="nav-shop" class="hover:text-[#D4AF37] transition-colors py-1"></button>
        <button onclick="scrollToStory()" id="nav-about" class="hover:text-[#D4AF37] transition-colors py-1"></button>
      </nav>

      <!-- AMORE Logo (New Brand Logo) -->
      <div onclick="switchView('home')" class="flex flex-col items-center cursor-pointer group py-1 select-none">
        <!-- SVG Logo matching the provided image -->
        <svg width="48" height="48" viewBox="0 0 120 130" fill="none" xmlns="http://www.w3.org/2000/svg" class="transition-transform group-hover:scale-105">
          <!-- Bottle cap -->
          <rect x="52" y="2" width="16" height="8" rx="2" fill="#D4AF37"/>
          <!-- Bottle body outer frame -->
          <rect x="28" y="18" width="64" height="72" rx="6" fill="none" stroke="#D4AF37" stroke-width="4"/>
          <!-- Bottle inner cross/diamond pattern -->
          <line x1="28" y1="18" x2="92" y2="90" stroke="#D4AF37" stroke-width="3.5"/>
          <line x1="92" y1="18" x2="28" y2="90" stroke="#D4AF37" stroke-width="3.5"/>
          <!-- Neck of bottle -->
          <rect x="48" y="10" width="24" height="10" rx="2" fill="none" stroke="#D4AF37" stroke-width="3"/>
          <!-- Clipping frame rectangle to contain cross lines -->
          <rect x="28" y="18" width="64" height="72" rx="6" fill="none" stroke="#D4AF37" stroke-width="4"/>
          <!-- Bottom C curve -->
          <path d="M 44 88 Q 60 100 76 88" fill="none" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span class="font-serif text-xl sm:text-2xl font-bold tracking-[0.25em] text-[#D4AF37] mt-0.5" style="font-family: 'Playfair Display', serif;">
          AMORE
        </span>
        <span id="brand-tagline" class="text-[9px] tracking-[0.3em] uppercase text-gray-300 font-light">
          EXCLUSIVE PERFUME
        </span>
      </div>

      <!-- Controls: Language, Theme, Cart -->
      <div class="flex items-center space-x-3 sm:space-x-4 rtl:space-x-reverse">
        <button onclick="toggleLanguage()" class="p-2 rounded-xl bg-[#00464D]/50 hover:bg-[#00464D] border border-[#D4AF37]/30 text-[#D4AF37] text-xs font-bold flex items-center gap-1.5 transition-all">
          <i data-lucide="globe" class="w-4 h-4"></i>
          <span id="lang-btn-text">EN</span>
        </button>
        <button onclick="toggleTheme()" class="p-2 rounded-xl bg-[#00464D]/50 hover:bg-[#00464D] border border-[#D4AF37]/30 text-[#D4AF37] transition-all">
          <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleCartDrawer(true)" class="relative p-2.5 rounded-xl bg-[#D4AF37] text-[#002B30] hover:bg-[#C29F2E] transition-all shadow-lg flex items-center justify-center">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-[#002B30] hidden">0</span>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Bar -->
    <div class="md:hidden flex items-center justify-around bg-[#002024] border-t border-[#D4AF37]/20 py-2.5 text-xs text-gray-300">
      <button onclick="switchView('home')" class="flex flex-col items-center gap-1 hover:text-[#D4AF37]">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span id="mob-home"></span>
      </button>
      <button onclick="switchView('shop')" class="flex flex-col items-center gap-1 hover:text-[#D4AF37]">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span id="mob-shop"></span>
      </button>
      <button onclick="scrollToStory()" class="flex flex-col items-center gap-1 hover:text-[#D4AF37]">
        <i data-lucide="star" class="w-4 h-4"></i>
        <span id="mob-about"></span>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-container" class="flex-grow">
    
    <!-- 1. HOME VIEW -->
    <div id="view-home" class="view-section space-y-16 pb-20">
      
      <!-- Hero Section -->
      <section class="relative min-h-[82vh] flex items-center justify-center overflow-hidden bg-gradient-to-b from-[#002B30] via-[#00383D] to-[#002024] text-white px-4">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#D4AF37_1px,transparent_1px)] [background-size:24px_24px]"></div>
        <div class="relative z-10 max-w-4xl mx-auto text-center space-y-8 py-16 fade-in-up">
          <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/30 text-[#D4AF37] text-xs uppercase tracking-widest font-semibold">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>AMORE Haute Parfumerie</span>
          </div>
          <h1 id="hero-title" class="font-serif text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-[#FAF8F5] leading-tight"></h1>
          <p id="hero-subtitle" class="text-base sm:text-xl text-gray-300 max-w-2xl mx-auto leading-relaxed font-light"></p>
          <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
            <button onclick="switchView('shop')" class="w-full sm:w-auto px-8 py-4 rounded-xl bg-[#D4AF37] text-[#002B30] font-bold hover:bg-[#E5C158] transition-all shadow-xl flex items-center justify-center gap-2">
              <span id="hero-cta"></span>
              <i data-lucide="arrow-left" class="w-5 h-5 rtl:inline hidden"></i>
              <i data-lucide="arrow-right" class="w-5 h-5 ltr:inline hidden"></i>
            </button>
            <button onclick="document.getElementById('bestsellers-section').scrollIntoView({behavior:'smooth'})" id="hero-bestsellers-btn" class="w-full sm:w-auto px-8 py-4 rounded-xl bg-transparent border border-[#D4AF37]/50 text-[#D4AF37] font-semibold hover:bg-[#D4AF37]/10 transition-all"></button>
          </div>
        </div>
      </section>

      <!-- Fragrance Categories Grid -->
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center space-y-3 mb-10">
          <h2 id="cat-title" class="font-serif text-3xl font-bold text-[#D4AF37]"></h2>
          <p id="cat-sub" class="text-xs sm:text-sm text-gray-400 max-w-md mx-auto"></p>
        </div>
        <div id="home-categories-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6"></div>
      </section>

      <!-- Featured Masterpieces -->
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 border-b border-[#D4AF37]/20 pb-4">
          <div>
            <h2 id="featured-title" class="font-serif text-3xl font-bold text-[#D4AF37]"></h2>
            <p id="featured-sub" class="text-xs sm:text-sm text-gray-400 mt-1"></p>
          </div>
          <button onclick="switchView('shop')" id="see-all-btn" class="text-xs font-bold text-[#D4AF37] hover:underline flex items-center gap-1"></button>
        </div>
        <div id="featured-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      </section>

      <!-- Best Sellers Section -->
      <section id="bestsellers-section" class="bg-[#00353A]/40 py-16 border-y border-[#D4AF37]/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
          <div class="text-center space-y-2">
            <h2 id="bestsellers-title" class="font-serif text-3xl font-bold text-[#D4AF37]"></h2>
            <p id="bestsellers-sub" class="text-xs sm:text-sm text-gray-400"></p>
          </div>
          <div id="bestsellers-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
      </section>

      <!-- Brand Story Section -->
      <section id="story-section" class="max-w-4xl mx-auto px-4 text-center space-y-6">
        <div class="inline-block p-3 rounded-full bg-[#D4AF37]/10 text-[#D4AF37]">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <h2 id="story-title" class="font-serif text-3xl sm:text-4xl font-bold text-[#D4AF37]"></h2>
        <p id="story-desc" class="text-gray-300 leading-relaxed text-base sm:text-lg font-light"></p>
      </section>

      <!-- Customer Trust Banner -->
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-8 rounded-3xl bg-[#00383D]/60 border border-[#D4AF37]/30 text-center shadow-xl">
          <div class="space-y-3 p-4">
            <i data-lucide="truck" class="w-8 h-8 text-[#D4AF37] mx-auto"></i>
            <h3 id="trust-del-title" class="font-serif font-bold text-lg text-[#FAF8F5]"></h3>
            <p id="trust-del-desc" class="text-xs text-gray-400"></p>
          </div>
          <div class="space-y-3 p-4 border-y md:border-y-0 md:border-x border-[#D4AF37]/20">
            <i data-lucide="shield-check" class="w-8 h-8 text-[#D4AF37] mx-auto"></i>
            <h3 id="trust-auth-title" class="font-serif font-bold text-lg text-[#FAF8F5]"></h3>
            <p id="trust-auth-desc" class="text-xs text-gray-400"></p>
          </div>
          <div class="space-y-3 p-4">
            <i data-lucide="headset" class="w-8 h-8 text-[#D4AF37] mx-auto"></i>
            <h3 id="trust-sup-title" class="font-serif font-bold text-lg text-[#FAF8F5]"></h3>
            <p id="trust-sup-desc" class="text-xs text-gray-400"></p>
          </div>
        </div>
      </section>
    </div>

    <!-- 2. SHOP CATALOG VIEW -->
    <div id="view-shop" class="view-section hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
      
      <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-[#00383D]/50 p-6 rounded-3xl border border-[#D4AF37]/20 shadow-lg">
        <div>
          <h1 id="shop-title" class="font-serif text-3xl font-bold text-[#D4AF37]"></h1>
          <p id="shop-result-count" class="text-xs text-gray-400 mt-1"></p>
        </div>
        <div class="relative flex-1 max-w-md">
          <input id="shop-search-input" type="text" oninput="handleSearch(this.value)"
            class="w-full pl-10 pr-4 rtl:pr-10 rtl:pl-4 py-3 rounded-2xl bg-[#002B30] border border-[#D4AF37]/30 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-[#D4AF37]" />
          <i data-lucide="search" class="w-4 h-4 absolute left-3 rtl:right-3 top-3.5 text-gray-400"></i>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="space-y-6 bg-[#00383D]/30 p-6 rounded-3xl border border-[#D4AF37]/20 h-fit shadow-md">
          <div class="flex items-center justify-between border-b border-[#D4AF37]/20 pb-4">
            <span id="filter-title" class="font-serif font-bold text-sm text-[#D4AF37] flex items-center gap-2"></span>
            <button onclick="resetFilters()" id="reset-filters-btn" class="text-xs text-gray-400 hover:text-[#D4AF37] flex items-center gap-1"></button>
          </div>
          <div class="space-y-2">
            <label id="filter-cat-label" class="text-[10px] font-bold uppercase tracking-wider text-gray-300 block"></label>
            <div id="shop-category-list" class="space-y-1"></div>
          </div>
          <div class="space-y-3 pt-4 border-t border-[#D4AF37]/20">
            <div class="flex justify-between items-center text-xs font-bold text-gray-300">
              <span id="filter-price-label"></span>
              <span id="price-range-val" class="text-[#D4AF37]">15000 EGP</span>
            </div>
            <input id="price-range-input" type="range" min="500" max="15000" step="250" value="15000"
              oninput="handlePriceRange(this.value)" class="w-full accent-[#D4AF37] bg-[#002B30]" />
          </div>
          <div class="space-y-2 pt-4 border-t border-[#D4AF37]/20">
            <label id="sort-label" class="text-[10px] font-bold uppercase tracking-wider text-gray-300 block"></label>
            <select id="sort-select" onchange="handleSort(this.value)"
              class="w-full p-2.5 rounded-xl bg-[#002B30] border border-[#D4AF37]/30 text-xs text-white focus:outline-none focus:border-[#D4AF37]">
              <option value="newest" id="sort-newest"></option>
              <option value="priceLow" id="sort-low"></option>
              <option value="priceHigh" id="sort-high"></option>
              <option value="popular" id="sort-popular"></option>
            </select>
          </div>
        </aside>

        <div class="lg:col-span-3">
          <!-- Loading state for Firebase products -->
          <div id="shop-loading" class="text-center py-20 space-y-4">
            <div class="w-10 h-10 border-4 border-[#D4AF37]/30 border-t-[#D4AF37] rounded-full animate-spin mx-auto"></div>
            <p class="text-gray-400 text-xs">Loading fragrances...</p>
          </div>
          <div id="shop-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
          <div id="shop-empty-state" class="hidden text-center py-20 bg-[#00383D]/20 rounded-3xl border border-dashed border-[#D4AF37]/30 space-y-4">
            <i data-lucide="alert-circle" class="w-12 h-12 text-[#D4AF37] mx-auto opacity-60"></i>
            <p id="empty-msg" class="text-gray-300 text-sm font-medium"></p>
            <button onclick="resetFilters()" id="empty-reset-btn" class="px-6 py-2.5 rounded-xl bg-[#D4AF37] text-[#002B30] font-bold text-xs hover:bg-[#C29F2E] transition-colors"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. PRODUCT DETAIL VIEW -->
    <div id="view-product-detail" class="view-section hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-16">
      <button onclick="switchView('shop')" id="back-to-shop-btn" class="text-xs font-bold text-[#D4AF37] hover:underline flex items-center gap-2"></button>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem;">
        <div class="rounded-3xl overflow-hidden bg-[#002024] border border-[#D4AF37]/30 shadow-2xl aspect-square relative">
          <img id="pd-image" src="" alt="" class="w-full h-full object-cover">
          <span id="pd-badge" class="absolute top-4 left-4 bg-[#D4AF37] text-[#002B30] text-xs font-bold px-3 py-1.5 rounded-full shadow hidden"></span>
        </div>
        <div class="space-y-6">
          <div>
            <span id="pd-brand" class="text-xs uppercase font-bold tracking-widest text-[#D4AF37]"></span>
            <h1 id="pd-name" class="font-serif text-3xl sm:text-4xl font-bold text-[#FAF8F5] mt-1"></h1>
          </div>
          <div class="flex items-center gap-4 border-y border-[#D4AF37]/20 py-4">
            <span id="pd-price" class="font-serif font-bold text-3xl text-[#D4AF37]"></span>
            <span id="pd-old-price" class="text-sm text-gray-400 line-through hidden"></span>
            <span id="pd-stock-badge" class="text-xs px-3 py-1 rounded-full font-bold"></span>
          </div>
          <p id="pd-desc" class="text-gray-300 text-sm leading-relaxed font-light"></p>
          <div id="pd-notes-container" class="bg-[#00383D]/40 p-5 rounded-2xl border border-[#D4AF37]/20 space-y-3">
            <h3 id="pd-notes-title" class="font-serif font-bold text-xs text-[#D4AF37] flex items-center gap-2"></h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div class="p-2.5 rounded-xl bg-[#002B30]">
                <span id="pd-top-label" class="text-[#D4AF37] font-bold block mb-1"></span>
                <span id="pd-top-val" class="text-gray-300"></span>
              </div>
              <div class="p-2.5 rounded-xl bg-[#002B30]">
                <span id="pd-heart-label" class="text-[#D4AF37] font-bold block mb-1"></span>
                <span id="pd-heart-val" class="text-gray-300"></span>
              </div>
              <div class="p-2.5 rounded-xl bg-[#002B30]">
                <span id="pd-base-label" class="text-[#D4AF37] font-bold block mb-1"></span>
                <span id="pd-base-val" class="text-gray-300"></span>
              </div>
            </div>
          </div>
          <div id="pd-sizes-container" class="space-y-2">
            <label id="pd-size-label" class="text-[10px] font-bold uppercase tracking-wider text-gray-300 block"></label>
            <div id="pd-size-options" class="flex gap-3"></div>
          </div>
          <div class="flex flex-col sm:flex-row gap-4 pt-4">
            <div class="flex items-center justify-between bg-[#002B30] border border-[#D4AF37]/30 rounded-xl p-2 w-full sm:w-36">
              <button onclick="adjustDetailQty(-1)" class="p-1 text-gray-300 hover:text-[#D4AF37]"><i data-lucide="minus" class="w-4 h-4"></i></button>
              <span id="pd-qty-val" class="font-bold text-sm text-white">1</span>
              <button onclick="adjustDetailQty(1)" class="p-1 text-gray-300 hover:text-[#D4AF37]"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            <button onclick="addDetailToCart()" id="pd-add-cart-btn" class="flex-1 py-3.5 px-6 rounded-xl bg-[#D4AF37] hover:bg-[#C29F2E] text-[#002B30] font-bold text-xs shadow-xl flex items-center justify-center gap-2 transition-all">
              <i data-lucide="shopping-bag" class="w-4 h-4"></i>
              <span id="pd-add-cart-text"></span>
            </button>
          </div>
          <button onclick="quickOrderCurrentDetailWA()" class="w-full py-3.5 px-6 rounded-xl bg-[#25D366] hover:bg-[#20BD5A] text-white font-bold text-xs shadow-xl flex items-center justify-center gap-2 transition-all">
            <i data-lucide="phone" class="w-4 h-4"></i>
            <span id="pd-quick-wa-text"></span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- SHOPPING CART DRAWER MODAL -->
  <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-xs transition-opacity hidden">
    <div class="absolute inset-y-0 right-0 ltr:right-0 rtl:left-0 max-w-full flex">
      <div class="w-screen max-w-md bg-[#002B30] text-white border-l border-[#D4AF37]/30 shadow-2xl flex flex-col justify-between">
        <div class="p-6 border-b border-[#D4AF37]/20 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-[#D4AF37]"></i>

    // ── GLOBAL APP STATE ─────────────────────────────────────────────
    let state = {
      lang: localStorage.getItem('amore_lang') || 'ar',
      theme: localStorage.getItem('amore_theme') || 'dark',
      view: 'home',
      selectedProductId: null,
      selectedCategory: 'all',
      searchQuery: '',
      maxPrice: 15000,
      sortBy: 'newest',
      cart: JSON.parse(localStorage.getItem('amore_cart')) || [],
      products: [],
      detailQty: 1,
      detailSize: '100ml',
      quickViewProduct: null,
      firebaseLoaded: false
    };

    // ── INITIALIZATION ────────────────────────────────────────────────
    window.addEventListener('firebase-ready', async () => {
      applyTheme();
      applyLanguage();

      if (window.__amoreFirebaseReady && window.__amoreFirestore) {
        await loadProductsFromFirebase();
      } else {
        // Use seed data as demo fallback
        state.products = SEED_PRODUCTS;
        document.getElementById('shop-loading').classList.add('hidden');
        renderAll();
      }
      lucide.createIcons();
    });

    // Failsafe if Firebase module script fails entirely
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (state.products.length === 0 && !state.firebaseLoaded) {
          state.products = SEED_PRODUCTS;
          applyTheme();
          applyLanguage();
          document.getElementById('shop-loading').classList.add('hidden');
          renderAll();
          lucide.createIcons();
        }
      }, 3000);
    });

    // ── FIREBASE PRODUCT LOADER ───────────────────────────────────────
    async function loadProductsFromFirebase() {
      try {
        const db = window.__amoreFirestore;
        const { collection, getDocs, onSnapshot, query, orderBy } = window.__amoreFirestoreModules;

        // Real-time listener for products (public read: available only)
        const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snapshot) => {
          const products = [];
          snapshot.forEach(doc => {
            const d = doc.data();
            // Only show products that are inStock and have stock > 0
            if (d.inStock && d.stock > 0) {
              products.push({ id: doc.id, ...d });
            }
          });

          // If Firestore has no products yet, use seeds
          state.products = products.length > 0 ? products : SEED_PRODUCTS;
          state.firebaseLoaded = true;
          document.getElementById('shop-loading').classList.add('hidden');
          renderAll();
          if (state.view === 'shop') renderShop();
          lucide.createIcons();
        }, (err) => {
          console.warn('[AMORE] Firestore read error:', err.message);
          state.products = SEED_PRODUCTS;
          document.getElementById('shop-loading').classList.add('hidden');
          renderAll();
          lucide.createIcons();
        });

      } catch (err) {
        console.warn('[AMORE] Firebase load failed:', err.message);
        state.products = SEED_PRODUCTS;
        document.getElementById('shop-loading').classList.add('hidden');
        renderAll();
        lucide.createIcons();
      }
    }

    // ── VIEW SWITCHER ─────────────────────────────────────────────────
    function switchView(viewName, productId = null) {
      state.view = viewName;
      if (productId) state.selectedProductId = productId;
      document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
      const viewMap = { product: 'product-detail' };
      document.getElementById(`view-${viewMap[viewName] || viewName}`).classList.remove('hidden');
      window.scrollTo(0, 0);
      if (viewName === 'shop') renderShop();
      if (viewName === 'product') renderProductDetail();
    }

    function scrollToStory() {
      if (state.view !== 'home') { switchView('home'); }
      setTimeout(() => {
        document.getElementById('story-section').scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }

      const toast = document.getElementById('toast');

      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);

      const grid = document.getElementById('featured-products-grid');

      const grid = document.getElementById('bestsellers-products-grid');
      const best = state.products.filter(p => p.isBestSeller && p.inStock && p.stock > 0).slice(0, 4);
      grid.innerHTML = best.map(p => createProductCardHTML(p)).join('');

    // ── PRODUCT CARD ──────────────────────────────────────────────────
    function createProductCardHTML(p) {
      const t = I18N[state.lang];
      const name = state.lang === 'ar' ? p.name_ar : p.name_en;

      const available = p.inStock && p.stock > 0;

      return `
        <div class="group rounded-3xl bg-[#00383D]/40 border border-[#D4AF37]/20 hover:border-[#D4AF37] transition-all duration-300 shadow-lg hover:shadow-2xl overflow-hidden flex flex-col justify-between">

    // ── SHOP CATALOG ──────────────────────────────────────────────────
    function renderShop() {
      const catList = document.getElementById('shop-category-list');
      catList.innerHTML = CATEGORIES.map(cat => `
        <button onclick="state.selectedCategory='${cat.id}'; renderShop();" class="w-full text-start px-3 py-2 rounded-xl text-xs font-medium transition-colors flex items-center justify-between ${state.selectedCategory === cat.id ? 'bg-[#D4AF37] text-[#002B30] font-bold' : 'text-gray-300 hover:bg-[#00464D]/50'}">
          <span>${cat[state.lang]}</span>
          ${state.selectedCategory === cat.id ? '<i data-lucide="check-circle" class="w-3.5 h-3.5"></i>' : ''}
        </button>
      `).join('');

      // Show only available products publicly
      const availableProducts = state.products.filter(p => p.inStock && p.stock > 0);

      const filtered = availableProducts.filter(p => {
        const cats = p.categoryIds || (p.category ? [p.category] : []);
        if (state.selectedCategory !== 'all' && !cats.includes(state.selectedCategory)) return false;
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.toLowerCase();
          const matchName = (p.name_en || '').toLowerCase().includes(q) || (p.name_ar || '').includes(q);
          const matchBrand = (p.brand || '').toLowerCase().includes(q);
          if (!matchName && !matchBrand) return false;
        }
        if (p.price > state.maxPrice) return false;
        return true;
      }).sort((a, b) => {
        if (state.sortBy === 'priceLow') return a.price - b.price;
        if (state.sortBy === 'priceHigh') return b.price - a.price;
        if (state.sortBy === 'popular') return (b.isBestSeller ? 1 : 0) - (a.isBestSeller ? 1 : 0);
        return 0;
      });

      document.getElementById('shop-result-count').innerText = `${filtered.length} ${state.lang === 'ar' ? 'عطر متوفر' : 'fragrances available'}`;
      const grid = document.getElementById('shop-products-grid');
      const emptyState = document.getElementById('shop-empty-state');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        grid.innerHTML = filtered.map(p => createProductCardHTML(p)).join('');
      }
      lucide.createIcons();
    }

    function handleSearch(val) { state.searchQuery = val; renderShop(); }
    function handlePriceRange(val) {
      state.maxPrice = Number(val);
      document.getElementById('price-range-val').innerText = `${val} ${I18N[state.lang].egp}`;
      renderShop();
    }
    function handleSort(val) { state.sortBy = val; renderShop(); }
    function resetFilters() {
      state.selectedCategory = 'all';
      state.searchQuery = '';
      state.maxPrice = 15000;
      state.sortBy = 'newest';
      const si = document.getElementById('shop-search-input');
      if (si) si.value = '';
      const pi = document.getElementById('price-range-input');
      if (pi) pi.value = 15000;
      document.getElementById('price-range-val').innerText = `15000 ${I18N[state.lang].egp}`;
      renderShop();
    }

    // ── PRODUCT DETAIL ────────────────────────────────────────────────
    function renderProductDetail() {
      const p = state.products.find(item => item.id == state.selectedProductId) || state.products[0];
      if (!p) return;
      const t = I18N[state.lang];

      document.getElementById('back-to-shop-btn').innerText = `← ${t.navShop}`;
      document.getElementById('pd-image').src = p.image || '';
      document.getElementById('pd-brand').innerText = p.brand;
      document.getElementById('pd-name').innerText = state.lang === 'ar' ? p.name_ar : p.name_en;
      document.getElementById('pd-price').innerText = `${p.price} ${t.egp}`;

      const oldP = document.getElementById('pd-old-price');
      if (p.oldPrice) { oldP.innerText = `${p.oldPrice} ${t.egp}`; oldP.classList.remove('hidden'); }
      else oldP.classList.add('hidden');

      const stockBadge = document.getElementById('pd-stock-badge');
      if (p.inStock && p.stock > 0) {
        stockBadge.innerText = `${t.inStock} (${p.stock})`;
        stockBadge.className = 'text-xs px-3 py-1 rounded-full font-bold bg-green-900/60 text-green-300';
      } else {
        stockBadge.innerText = t.outOfStock;
        stockBadge.className = 'text-xs px-3 py-1 rounded-full font-bold bg-red-900/60 text-red-300';
      }

      document.getElementById('pd-desc').innerText = state.lang === 'ar' ? (p.desc_ar || '') : (p.desc_en || '');
      document.getElementById('pd-notes-title').innerText = state.lang === 'ar' ? 'الهرم العطري والمكونات' : 'Fragrance Pyramid Notes';
      document.getElementById('pd-top-label').innerText = state.lang === 'ar' ? 'افتتاحية العطر' : 'Top Notes';
      document.getElementById('pd-top-val').innerText = p.notes?.top || 'Fresh Citrus';
      document.getElementById('pd-heart-label').innerText = state.lang === 'ar' ? 'قلب العطر' : 'Heart Notes';
      document.getElementById('pd-heart-val').innerText = p.notes?.heart || 'Spicy Floral';
      document.getElementById('pd-base-label').innerText = state.lang === 'ar' ? 'قاعدة العطر' : 'Base Notes';
      document.getElementById('pd-base-val').innerText = p.notes?.base || 'Warm Amber';

      document.getElementById('pd-size-label').innerText = state.lang === 'ar' ? 'اختر الحجم:' : 'Select Size:';
      const sizesContainer = document.getElementById('pd-size-options');
      const sizes = p.sizes || ['100ml'];
      state.detailSize = sizes[0];
      sizesContainer.innerHTML = sizes.map(s => `
        <button onclick="selectDetailSize('${s}', this)" class="pd-size-btn px-4 py-2.5 rounded-xl text-xs font-bold border ${s === state.detailSize ? 'bg-[#D4AF37] text-[#002B30] border-[#D4AF37]' : 'bg-[#002B30] text-gray-300 border-[#D4AF37]/30'}">${s}</button>
      `).join('');

      document.getElementById('pd-qty-val').innerText = state.detailQty;
      document.getElementById('pd-add-cart-text').innerText = t.addToCart;
      document.getElementById('pd-quick-wa-text').innerText = t.quickWA;
      lucide.createIcons();
    }

    function selectDetailSize(size, btn) {
      state.detailSize = size;
      document.querySelectorAll('.pd-size-btn').forEach(b => {
        b.className = 'pd-size-btn px-4 py-2.5 rounded-xl text-xs font-bold border bg-[#002B30] text-gray-300 border-[#D4AF37]/30';
      });
      btn.className = 'pd-size-btn px-4 py-2.5 rounded-xl text-xs font-bold border bg-[#D4AF37] text-[#002B30] border-[#D4AF37]';
    }

    function adjustDetailQty(delta) {
      state.detailQty = Math.max(1, state.detailQty + delta);
      document.getElementById('pd-qty-val').innerText = state.detailQty;
    }

    function addDetailToCart() {
      const p = state.products.find(item => item.id == state.selectedProductId);
      if (p) addToCart(p.id, state.detailSize, state.detailQty);
    }

    function quickOrderCurrentDetailWA() {
      const p = state.products.find(item => item.id == state.selectedProductId);
      if (p) quickOrderWA(p.id, state.detailSize);
    }

    // ── CART ──────────────────────────────────────────────────────────
    function addToCart(productId, size = '100ml', qty = 1) {
      const product = state.products.find(p => p.id == productId);
      if (!product || !product.inStock || product.stock <= 0) return;

      const cartItemId = `${product.id}-${size}`;
      const existing = state.cart.find(item => item.cartItemId === cartItemId);

      if (existing) { existing.quantity += qty; }
      else {
        state.cart.push({
          cartItemId, id: product.id, product, size, quantity: qty, price: product.price
        });
      }

      saveCart();
      showToast(state.lang === 'ar' ? 'تمت إضافة العطر إلى حقيبة التسوق.' : 'Item added to shopping bag.');
    }

    function updateCartQty(cartItemId, delta) {
      const item = state.cart.find(i => i.cartItemId === cartItemId);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) state.cart = state.cart.filter(i => i.cartItemId !== cartItemId);
      saveCart();
      renderCartDrawerContent();
    }

    function saveCart() { localStorage.setItem('amore_cart', JSON.stringify(state.cart)); updateCartBadge(); }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      const totalCount = state.cart.reduce((a, b) => a + b.quantity, 0);
      if (totalCount > 0) { badge.innerText = totalCount; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    }

    function toggleCartDrawer(open) {
      const drawer = document.getElementById('cart-drawer');
      if (open) { renderCartDrawerContent(); drawer.classList.remove('hidden'); }
      else drawer.classList.add('hidden');
    }

    function renderCartDrawerContent() {
      const container = document.getElementById('cart-items-container');
      const footer = document.getElementById('cart-drawer-footer');
      const t = I18N[state.lang];

      if (state.cart.length === 0) {
        container.innerHTML = `<p class="text-center py-20 text-gray-400 text-xs">${state.lang === 'ar' ? 'حقيبة التسوق فارغة حالياً.' : 'Shopping bag is empty.'}</p>`;
        footer.classList.add('hidden');
        return;
      }

      footer.classList.remove('hidden');
      let subtotal = 0;

      container.innerHTML = state.cart.map(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        const name = state.lang === 'ar' ? item.product.name_ar : item.product.name_en;
        return `
          <div class="flex gap-4 p-3 rounded-2xl bg-[#00383D]/50 border border-[#D4AF37]/10 items-center">
            <img src="${item.product.image || ''}" alt="" class="w-14 h-14 object-cover rounded-xl bg-[#002024]">
            <div class="flex-1">
              <h4 class="font-serif font-bold text-xs text-white line-clamp-1">${name}</h4>
              <span class="text-[10px] text-gray-400 block">${item.size}</span>
              <span class="text-xs font-bold text-[#D4AF37]">${item.price} ${t.egp}</span>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center bg-[#002B30] border border-[#D4AF37]/30 rounded-lg px-2 py-0.5">
                  <button onclick="updateCartQty('${item.cartItemId}', -1)" class="text-xs hover:text-[#D4AF37]">-</button>
                  <span class="text-xs font-bold px-2">${item.quantity}</span>
                  <button onclick="updateCartQty('${item.cartItemId}', 1)" class="text-xs hover:text-[#D4AF37]">+</button>
                </div>
                <button onclick="updateCartQty('${item.cartItemId}', -${item.quantity})" class="text-red-400 hover:text-red-300 text-xs">Remove</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-subtotal-val').innerText = `${subtotal} ${t.egp}`;
    }

    // ── CHECKOUT & WHATSAPP ───────────────────────────────────────────
    function openCheckoutModal() {
      toggleCartDrawer(false);
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function handleCheckoutSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('checkout-name').value.trim();
      const phone = document.getElementById('checkout-phone').value.trim();
      const address = document.getElementById('checkout-address').value.trim();
      const notes = document.getElementById('checkout-notes').value.trim();
      if (!name || !phone || !address) return;

      const subtotal = state.cart.reduce((a, b) => a + (b.price * b.quantity), 0);
      let text = "";
      if (state.lang === 'ar') {
        text = `مرحباً AMORE Exclusive Perfume 👑\nأود تأكيد الطلب التالي:\n\n` +
          `👤 *الاسم:* ${name}\n📞 *الهاتف:* ${phone}\n📍 *العنوان:* ${address}\n\n` +
          `🛒 *تفاصيل العطور:*\n` +
          state.cart.map(i => `• ${i.product.name_ar} (${i.size}) - الكمية: ${i.quantity} - السعر: ${i.price * i.quantity} جنيه`).join('\n') +
          `\n\n💰 *الإجمالي الكلي:* ${subtotal} جنيه` +
          (notes ? `\n📝 *ملاحظات:* ${notes}` : '') + `\n\nشكراً!`;
      } else {
        text = `Hello AMORE Exclusive Perfume 👑\nI'd like to place the following order:\n\n` +
          `👤 *Name:* ${name}\n📞 *Phone:* ${phone}\n📍 *Address:* ${address}\n\n` +
          `🛒 *Fragrances:*\n` +
          state.cart.map(i => `• ${i.product.name_en} (${i.size}) - Qty: ${i.quantity} - Price: ${i.price * i.quantity} EGP`).join('\n') +
          `\n\n💰 *Total:* ${subtotal} EGP` +
          (notes ? `\n📝 *Notes:* ${notes}` : '') + `\n\nThank you!`;
      }

      state.cart = [];
      saveCart();
      closeCheckoutModal();
      showToast(state.lang === 'ar' ? 'جاري الانتقال لواتساب...' : 'Opening WhatsApp...');
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function quickOrderWA(productId, size = '100ml') {
      const p = state.products.find(item => item.id == productId);
      if (!p) return;
      let text = state.lang === 'ar'
        ? `مرحباً AMORE Exclusive Perfume 👑\nأود الاستفسار عن:\n\nالعطر: *${p.name_ar}*\nالحجم: ${size}\nالسعر: ${p.price} جنيه\n\nأرجو التواصل لتأكيد الشحن.`
        : `Hello AMORE Exclusive Perfume 👑\nI'm interested in ordering:\n\nProduct: *${p.name_en}*\nSize: ${size}\nPrice: ${p.price} EGP\n\nPlease guide me to finalize.`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
    }

    // ── QUICK VIEW ────────────────────────────────────────────────────
    function openQuickView(productId) {
      const p = state.products.find(item => item.id == productId);
      if (!p) return;
      state.quickViewProduct = p;
      document.getElementById('qv-image').src = p.image || '';
      document.getElementById('qv-brand').innerText = p.brand;
      document.getElementById('qv-name').innerText = state.lang === 'ar' ? p.name_ar : p.name_en;
      document.getElementById('qv-price').innerText = `${p.price} ${I18N[state.lang].egp}`;
      document.getElementById('qv-desc').innerText = state.lang === 'ar' ? (p.desc_ar || '') : (p.desc_en || '');
      document.getElementById('qv-add-cart-btn').innerText = I18N[state.lang].addToCart;
      document.getElementById('quickview-modal').classList.remove('hidden');
    }

    function closeQuickView() { document.getElementById('quickview-modal').classList.add('hidden'); }
    function addQuickViewToCart() { if (state.quickViewProduct) { addToCart(state.quickViewProduct.id); closeQuickView(); } }
    function quickOrderQVWA() { if (state.quickViewProduct) { quickOrderWA(state.quickViewProduct.id); closeQuickView(); } }
  </script>
</body>
</html>
